name: Reconcile engagement aggregates

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      execute:
        description: Apply reconciliation (leave disabled for a dry run)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-engagement-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preview reconciliation
        if: github.event_name == 'workflow_dispatch' && !inputs.execute
        run: npm run db:reconcile-engagement -- --limit=200
      - name: Reconcile bounded batch
        if: github.event_name == 'schedule' || inputs.execute
        run: npm run db:reconcile-engagement -- --execute --limit=200
