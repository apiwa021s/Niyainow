name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI verifies an artifact, not a deployable environment. Real production
      # values are mandatory at the platform build step.
      NEXT_PUBLIC_APP_URL: https://ci.niyainow.invalid
      NEXT_PUBLIC_ASSET_URL: https://assets.ci.niyainow.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
