name: Process translation jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum chapters to process in this invocation
        required: true
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: production-translation-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AI_TRANSLATION_API_KEY: ${{ secrets.AI_TRANSLATION_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:process-translations -- --limit=${{ github.event_name == 'workflow_dispatch' && inputs.limit || '3' }}
